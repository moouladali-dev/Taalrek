<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Joke Generator</title>
    <link rel="stylesheet" href="joke-styles.css">
</head>
<body>
    <div class="container">
        <div class="joke-app">
            <h1>😂 Random Joke Generator</h1>
            
            <div class="joke-display">
                <div id="jokeContent" class="joke-content">
                    <p id="jokeText">Click the button to get a joke!</p>
                </div>
            </div>

            <div class="button-group">
                <button id="generateBtn" class="generate-btn">Get a Joke</button>
                <button id="shareBtn" class="share-btn">Share Joke</button>
            </div>

            <div class="joke-type-selector">
                <label for="jokeType">Joke Type:</label>
                <select id="jokeType" class="joke-type">
                    <option value="general">General</option>
                    <option value="programming">Programming</option>
                    <option value="knock-knock">Knock-Knock</option>
                </select>
            </div>

            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>Loading joke...</p>
            </div>

            <div class="favorites">
                <h3>Favorite Jokes</h3>
                <ul id="favoritesList" class="favorites-list">
                    <!-- Favorites will be added here -->
                </ul>
                <button id="clearFavBtn" class="clear-fav-btn">Clear Favorites</button>
            </div>
        </div>
    </div>

    <script src="joke-script.js"></script>
</body>
</html>
