<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Pluspunt &amp; Taal Actief Oefenen</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito+Sans:wght@400;600;700;800&family=Space+Mono:wght@400;700&display=swap');
  :root{
    --paper:#FBF8F1; --line:#E3ECF5; --ink:#1E3A5F; --ink-soft:#5C7A9E;
    --blue:#3E8EDE; --purple:#7C5CBF; --amber:#F2A93B; --green:#3FA34D; --red:#EF6461;
    --border:#c9c2ac;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    background-image:repeating-linear-gradient(var(--paper) 0px, var(--paper) 27px, var(--line) 28px);
    font-family:'Nunito Sans', system-ui, sans-serif;
    color:var(--ink);
    -webkit-tap-highlight-color:transparent;
  }
  #app{max-width:820px; margin:0 auto; padding:20px 16px 60px;}
  h1,h2,h3{font-family:'Baloo 2','Nunito Sans',sans-serif; margin:0;}
  .mono{font-family:'Space Mono', monospace;}
  .row{display:flex; align-items:center;}
  .between{justify-content:space-between;}
  .wrap{flex-wrap:wrap;}
  .gap8{gap:8px;} .gap10{gap:10px;} .gap12{gap:12px;} .gap14{gap:14px;}
  .card{background:#fff; border:2px solid var(--ink); border-radius:14px; box-shadow:0 5px 0 var(--ink); padding:26px 24px;}
  .btn{
    font-family:'Nunito Sans',sans-serif; font-weight:800; font-size:14px; border:none; border-radius:8px;
    padding:12px 20px; cursor:pointer; transition:transform .12s ease; color:#fff; background:var(--blue);
    box-shadow:0 4px 0 #2c6bab;
  }
  .btn:active{transform:translateY(2px); box-shadow:0 1px 0 rgba(0,0,0,.3);}
  .btn.secondary{background:#fff; color:var(--ink); border:2px solid var(--ink); box-shadow:0 4px 0 var(--ink);}
  .btn.dark{background:var(--ink); box-shadow:0 4px 0 #0f2438;}
  .btn:disabled{opacity:.4; cursor:not-allowed;}
  .pill{display:inline-flex; align-items:center; gap:6px; padding:6px 12px; border-radius:999px; font-weight:800; font-size:12.5px; border:2px solid var(--ink); cursor:pointer; background:#fff; color:var(--ink);}
  .pill.active{background:var(--ink); color:#fff;}
  .topic-card{background:#fff; border-radius:10px; padding:16px 14px; cursor:pointer; text-align:left; transition:transform .15s ease;}
  .topic-card:hover{transform:translateY(-3px);}
  .topic-card.selected{outline:3px solid var(--ink); outline-offset:2px;}
  .badge{font-size:11px; font-weight:800; letter-spacing:.5px; text-transform:uppercase;}
  .muted{color:var(--ink-soft); font-weight:600;}
  input[type=text], textarea, select{font-family:'Space Mono',monospace; font-size:15px; font-weight:700; padding:12px 14px; border:2px solid var(--border); border-radius:8px; color:var(--ink); background:var(--paper); width:100%;}
  input[type=text]:focus, textarea:focus{outline:none; border-color:var(--blue);}
  .choice-btn{display:block; width:100%; text-align:left; padding:13px 16px; margin-bottom:8px; border-radius:8px; border:2px solid var(--border); background:#fff; font-weight:700; font-size:15px; cursor:pointer; color:var(--ink);}
  .choice-btn.correct{border-color:var(--green); background:#e7f5ea;}
  .choice-btn.wrong{border-color:var(--red); background:#fbeaea;}
  .choice-btn:disabled{cursor:default;}
  .fb{display:flex; align-items:center; gap:10px; padding:12px 16px; border-radius:8px; margin-bottom:16px; font-weight:700; font-size:15px;}
  .fb.ok{background:#e7f5ea; border:2px solid var(--green); color:#215c33;}
  .fb.bad{background:#fbeaea; border:2px solid var(--red); color:#7a2020;}
  .ruler{position:relative; height:40px; background:#FFFDF8; border:2px solid var(--ink); border-radius:4px; box-shadow:0 2px 0 var(--border); margin-top:26px;}
  .tick{position:absolute; top:0; bottom:0; border-right:1px solid #c9c2ac; transition:background .3s ease;}
  .tick span{position:absolute; bottom:3px; left:4px; font-family:'Space Mono',monospace; font-size:9px; color:var(--ink); opacity:.6;}
  .pencil{position:absolute; top:-22px; font-size:18px; transition:left .3s ease;}
  .result-row{display:flex; align-items:center; gap:12px; background:#fff; border-radius:8px; padding:10px 14px; margin-bottom:8px; border:2px solid var(--border);}
  .seg-group{display:flex; border:2px solid var(--ink); border-radius:8px; overflow:hidden;}
  .seg{flex:1; padding:9px 6px; text-align:center; font-weight:800; font-size:12.5px; cursor:pointer; background:#fff; color:var(--ink); border:none; border-right:2px solid var(--ink);}
  .seg:last-child{border-right:none;}
  .seg.active{background:var(--ink); color:#fff;}
  .timer{font-family:'Space Mono',monospace; font-weight:700; font-size:14px;}
  .timer.low{color:var(--red);}
  footer.tip{margin-top:34px; font-size:12px; color:var(--ink-soft); text-align:center; line-height:1.6;}
  .parent-link{text-align:center; margin-top:18px;}
  .parent-link a{font-size:12.5px; color:var(--ink-soft); text-decoration:underline; cursor:pointer;}
  .progress-row{margin-bottom:14px;}
  .progress-bar-bg{background:#eee5cf; border-radius:6px; height:14px; overflow:hidden; border:2px solid var(--ink);}
  .progress-bar-fill{height:100%; transition:width .3s ease;}
  .flag{font-size:11px; font-weight:800; padding:2px 8px; border-radius:999px; margin-left:6px;}
  .flag.low{background:#fbeaea; color:#7a2020;}
  .flag.mid{background:#fdf3e2; color:#8a5a06;}
  .flag.high{background:#e7f5ea; color:#215c33;}
  table.data-table{border-collapse:collapse; width:100%; margin:14px 0;}
  table.data-table th, table.data-table td{border:2px solid var(--ink); padding:8px 10px; font-family:'Space Mono',monospace; font-size:13.5px; text-align:left;}
  table.data-table th{background:var(--ink); color:#fff;}
  .bar-chart{display:flex; align-items:flex-end; gap:10px; height:150px; margin:16px 0 6px;}
  .bar-col{display:flex; flex-direction:column; align-items:center; flex:1; height:100%; justify-content:flex-end;}
  .bar-val{font-size:11px; font-weight:800; margin-bottom:4px;}
  .bar-rect{width:100%; border-radius:4px 4px 0 0; background:var(--blue);}
  .bar-label{font-size:11px; font-weight:700; margin-top:6px;}
  .sess-row{display:flex; gap:10px; align-items:center; background:#fff; border:2px solid var(--border); border-radius:8px; padding:8px 12px; margin-bottom:6px; font-size:12.5px; cursor:default;}
  .profile-card{background:#fff; border:3px solid var(--ink); border-radius:16px; padding:26px 18px; text-align:center; cursor:pointer; box-shadow:0 5px 0 var(--ink); transition:transform .15s ease;}
  .profile-card:hover{transform:translateY(-3px);}
  .pin-dots{display:flex; gap:14px; justify-content:center; margin:20px 0;}
  .pin-dot{width:18px; height:18px; border-radius:50%; border:2px solid var(--ink); background:#fff;}
  .pin-dot.filled{background:var(--ink);}
  .pin-pad{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; max-width:280px; margin:0 auto;}
  .pin-key{font-family:'Space Mono',monospace; font-size:22px; font-weight:700; padding:18px 0; border-radius:10px; border:2px solid var(--ink); background:#fff; cursor:pointer;}
  .pin-key:active{background:var(--ink); color:#fff;}
  .star-strip{display:flex; gap:16px; flex-wrap:wrap; align-items:center; background:#fff; border:2px solid var(--ink); border-radius:12px; padding:14px 18px; margin-bottom:18px; box-shadow:0 4px 0 var(--ink);}
  .stat-chip{font-weight:800; font-size:14px; display:flex; align-items:center; gap:6px;}
  .badge-chip{display:inline-flex; flex-direction:column; align-items:center; width:78px; margin:4px; opacity:1;}
  .badge-chip.locked{opacity:.28;}
  .badge-chip .ic{font-size:26px;}
  .badge-chip .lb{font-size:10px; font-weight:800; text-align:center; margin-top:2px;}
  .toast{position:fixed; top:16px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; padding:12px 20px; border-radius:10px; font-weight:800; font-size:13.5px; z-index:50; box-shadow:0 4px 14px rgba(0,0,0,.25);}
  .loading{text-align:center; padding:40px 0; color:var(--ink-soft); font-weight:700;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:12.5px; font-weight:800; color:var(--ink-soft); margin-bottom:5px; text-transform:uppercase; letter-spacing:.4px;}
</style>
</head>
<body>
<div id="app"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import {
  getFirestore, doc, getDoc, setDoc, updateDoc, addDoc, collection,
  query, where, limit, getDocs, increment
} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

/* =========================================================
   HULPFUNCTIES
========================================================= */
const randInt = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
const pick = (arr) => arr[randInt(0, arr.length - 1)];
const shuffle = (arr) => { const a=[...arr]; for(let i=a.length-1;i>0;i--){const j=randInt(0,i); [a[i],a[j]]=[a[j],a[i]];} return a; };
const gcd = (a,b) => b===0 ? Math.abs(a) : gcd(b, a % b);
const lcm = (a,b) => Math.abs(a*b)/gcd(a,b);
const simplify = (num, den) => { if(num===0) return [0,1]; const g=gcd(num,den); return [num/g, den/g]; };
const round2 = (n) => Math.round(n*100)/100;
const esc = (s) => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const todayStr = () => new Date().toISOString().slice(0,10);

function parseNum(str){
  if(!str) return NaN;
  const s = str.trim().replace(/,/g,".").replace(/\s/g,"").replace("%","").replace("€","");
  if(s.includes("/")){
    const [a,b] = s.split("/").map(Number);
    if(!isNaN(a) && !isNaN(b) && b!==0) return a/b;
    return NaN;
  }
  return parseFloat(s);
}
function checkNumeric(input, expected, tol=0.01){ const v=parseNum(input); return !isNaN(v) && Math.abs(v-expected)<=tol; }
function checkText(input, expected){ if(!input) return false; return input.trim().toLowerCase()===expected.trim().toLowerCase(); }

const LEVEL_LABEL = {1:"Makkelijk", 2:"Gemiddeld", 3:"Moeilijk"};
function maxLevelForGrade(grade){ return grade>=7 ? 3 : 2; }

function toRoman(num){
  const table = [[1000,"M"],[900,"CM"],[500,"D"],[400,"CD"],[100,"C"],[90,"XC"],[50,"L"],[40,"XL"],[10,"X"],[9,"IX"],[5,"V"],[4,"IV"],[1,"I"]];
  let n = num, out = "";
  for(const [val, sym] of table){ while(n>=val){ out+=sym; n-=val; } }
  return out;
}

/* =========================================================
   REKENEN — generatoren
========================================================= */
const rekenGenerators = {
  hoofdrekenen(level){
    const type = pick(["plus","min","keer","deel"]);
    const R = {
      1:{addMin:20,addMax:200, mulMax:12, divB:[2,3,4,5,10], divQMax:12},
      2:{addMin:1200,addMax:60000, mulMax:89, divB:[3,4,6,7,8,9,11,12], divQMax:99},
      3:{addMin:50000,addMax:800000, mulMax:199, divB:[6,7,8,9,11,12,13,14], divQMax:199}
    }[level];
    let a,b,answer,prompt;
    if(type==="plus"){ a=randInt(R.addMin,R.addMax); b=randInt(R.addMin,R.addMax); answer=a+b; prompt=`Reken uit:\n${a} + ${b} =`; }
    else if(type==="min"){ a=randInt(R.addMin,R.addMax)+R.addMin; b=randInt(R.addMin, Math.max(R.addMin+1,a-R.addMin)); answer=a-b; prompt=`Reken uit:\n${a} - ${b} =`; }
    else if(type==="keer"){ const lo = level===1?2:12; a=randInt(lo,R.mulMax); b=randInt(lo,R.mulMax); answer=a*b; prompt=`Reken uit:\n${a} × ${b} =`; }
    else { const bb=pick(R.divB); const q=randInt(level===1?2:11, R.divQMax); a=bb*q; answer=q; prompt=`Reken uit:\n${a} : ${bb} =`; }
    return { kind:"numeric", prompt, answerValue:answer, answerDisplay:String(answer), formatHint:"Typ een heel getal.", placeholder:"antwoord" };
  },
  breuken(level){
    const densByLevel = {1:[2,3,4,5], 2:[2,3,4,5,6,8], 3:[3,4,5,6,8,10,12]};
    const dens = densByLevel[level];
    let type;
    if(level===1) type = "plusgelijk";
    else type = pick(["plusmin","keer"]);
    let prompt, rn, rd, value;
    if(type==="plusgelijk"){
      const d = pick(dens);
      let n1 = randInt(1,d-2), n2 = randInt(1,d-n1-1); if(n2<1) n2=1;
      const numResult = n1+n2;
      [rn,rd] = simplify(numResult, d); value = numResult/d;
      prompt = `Reken uit (zelfde noemer):\n${n1}/${d} + ${n2}/${d} =`;
    } else if(type==="plusmin"){
      const op = pick(["plus","min"]);
      let d1=pick(dens), d2=pick(dens), n1=randInt(1,d1-1), n2=randInt(1,d2-1);
      const l = lcm(d1,d2);
      let nn1=n1*(l/d1), nn2=n2*(l/d2);
      if(op==="min" && nn1<nn2){ [d1,d2]=[d2,d1]; [n1,n2]=[n2,n1]; nn1=n1*(l/d1); nn2=n2*(l/d2); }
      const numResult = op==="plus" ? nn1+nn2 : nn1-nn2;
      [rn,rd]=simplify(numResult,l); value=numResult/l;
      prompt = `Reken uit:\n${n1}/${d1} ${op==="plus"?"+":"-"} ${n2}/${d2} =`;
    } else {
      const d=pick(dens); const n=randInt(1,d-1); const whole=randInt(2,level===3?12:9);
      const numResult=n*whole; [rn,rd]=simplify(numResult,d); value=numResult/d;
      prompt = `Reken uit:\n${n}/${d} × ${whole} =`;
    }
    return { kind:"numeric", prompt, answerValue:value, answerDisplay: rd===1?`${rn}`:`${rn}/${rd}`, formatHint:"Geef je antwoord als breuk, bijvoorbeeld 3/4 (of als kommagetal).", placeholder:"bv. 3/4" };
  },
  procenten(level){
    const pctPools = {1:[10,25,50], 2:[5,10,15,20,25,40,50,75], 3:[5,15,20,30,40,60,75,80]};
    const pctList = pctPools[level];
    const type = level===1 ? "van" : pick(["van","isHoeveelProcent","korting"]);
    let prompt, answer, unitLabel;
    if(type==="van"){
      const pct=pick(pctList); const factor=100/gcd(pct,100); const base=factor*randInt(1, level===3?16:10);
      answer=(pct*base)/100; prompt = `Reken uit:\n${pct}% van ${base} =`; unitLabel="";
    } else if(type==="isHoeveelProcent"){
      const pct=pick(pctList); const factor=100/gcd(pct,100); const base=factor*randInt(1,10);
      const part=(pct*base)/100;
      prompt = `${part} is hoeveel procent van ${base}?\n(Typ alleen het getal, zonder %-teken.)`;
      answer=pct; unitLabel="%";
    } else {
      const pct=pick([10,20,25,50]); const factor=100/gcd(pct,100); const prijs=factor*randInt(1, level===3?8:5);
      const item = pick(["fiets","spel","jas","rugtas","koptelefoon"]);
      prompt = `Een ${item} kost €${prijs}. Er is ${pct}% korting.\nWat is de nieuwe prijs? (in euro's, zonder €-teken)`;
      answer = prijs - (prijs*pct)/100; unitLabel="€";
    }
    return { kind:"numeric", prompt, answerValue:answer, answerDisplay: unitLabel==="%"?`${answer}%`:unitLabel==="€"?`€${answer}`:String(answer), formatHint:"Typ alleen het getal.", placeholder:"antwoord" };
  },
  verhoudingen(level){
    const type = level===1 ? "recept" : pick(["recept","schaal"]);
    let prompt, answer, unitLabel;
    if(type==="recept"){
      const personsBase = pick(level===1?[2,4]:[2,3,4,5,6,8]);
      const perPerson = randInt(level===3?20:10, level===3?90:40);
      const amountBase = personsBase*perPerson;
      let personsTarget = randInt(2, level===1?8:12);
      while(personsTarget===personsBase) personsTarget = randInt(2, level===1?8:12);
      answer = perPerson*personsTarget;
      const ingredient = pick(["rijst","bloem","suiker","pasta","havermout"]);
      prompt = `Voor ${personsBase} personen heb je ${amountBase} gram ${ingredient} nodig.\nHoeveel gram heb je nodig voor ${personsTarget} personen? (in gram)`;
      unitLabel="gram";
    } else {
      const schaal = pick(level===3?[5000,10000,25000,50000]:[100,500,1000,2000,5000]);
      const afstandKaart = randInt(2,25);
      answer = (afstandKaart*schaal)/100;
      prompt = `Op een kaart met schaal 1 : ${schaal} is de afstand tussen twee dorpen ${afstandKaart} cm.\nWat is de werkelijke afstand in meters?`;
      unitLabel="m";
    }
    return { kind:"numeric", prompt, answerValue:answer, answerDisplay:`${answer} ${unitLabel}`, formatHint:"Typ alleen het getal.", placeholder:"antwoord" };
  },
  kommagetallen(level){
    let type = level===1 ? pick(["plus","min"]) : pick(["plus","min","keer"]);
    let prompt, answer;
    if(type==="plus" || type==="min"){
      const decimals = level===1 ? 1 : 2;
      const maxCents = level===3 ? 9999 : (level===2 ? 3000 : 990);
      let a = randInt(150, maxCents) / Math.pow(10,decimals);
      let b = randInt(150, maxCents) / Math.pow(10,decimals);
      if(type==="min" && a<b) [a,b]=[b,a];
      answer = round2(type==="plus" ? a+b : a-b);
      const fmt = (n) => n.toFixed(decimals).replace(".", ",");
      prompt = `Reken uit:\n${fmt(a)} ${type==="plus"?"+":"-"} ${fmt(b)} =`;
    } else {
      const a = randInt(15, level===3?199:99)/10;
      const whole = randInt(2, level===3?12:9);
      answer = round2(a*whole);
      prompt = `Reken uit:\n${a.toFixed(1).replace(".",",")} × ${whole} =`;
    }
    return { kind:"numeric", prompt, answerValue:answer, answerDisplay:String(answer).replace(".",","), formatHint:"Gebruik een komma, bijvoorbeeld 4,5.", placeholder:"bv. 4,5" };
  },
  meten(level){
    const type = pick(level===1?["oppervlakte","omtrek"]:["oppervlakte","omtrek","inhoud"]);
    let prompt, answer, unitLabel;
    const max = level===3?40:level===2?20:12;
    if(type==="oppervlakte"){
      const l=randInt(3,max), b=randInt(3,max); answer=l*b;
      prompt = `Een rechthoek heeft een lengte van ${l} cm en een breedte van ${b} cm.\nWat is de oppervlakte? (in cm²)`; unitLabel="cm²";
    } else if(type==="omtrek"){
      const l=randInt(3,max), b=randInt(3,max); answer=2*(l+b);
      prompt = `Een rechthoek heeft een lengte van ${l} cm en een breedte van ${b} cm.\nWat is de omtrek? (in cm)`; unitLabel="cm";
    } else {
      const l=randInt(2,level===3?15:10), b=randInt(2,level===3?15:10), h=randInt(2,level===3?15:10);
      answer=l*b*h;
      prompt = `Een balk heeft de afmetingen ${l} × ${b} × ${h} cm.\nWat is de inhoud? (in cm³)`; unitLabel="cm³";
    }
    return { kind:"numeric", prompt, answerValue:answer, answerDisplay:`${answer} ${unitLabel}`, formatHint:"Typ alleen het getal.", placeholder:"antwoord" };
  },
  negatief(level){
    const range = level===1?10:level===2?15:30;
    const a = randInt(-range,range);
    let b = randInt(-range,range); if(b===0) b=1;
    const op = level===1 ? "plus" : pick(["plus","min"]);
    const bStr = b<0 ? `(${b})` : `${b}`;
    const answer = op==="plus" ? a+b : a-b;
    const prompt = `Reken uit:\n${a} ${op==="plus"?"+":"-"} ${bStr} =`;
    return { kind:"numeric", prompt, answerValue:answer, answerDisplay:String(answer), formatHint:"Let op: het antwoord kan negatief zijn.", placeholder:"antwoord" };
  },
  tijd(level){
    const type = level===1?"snelheid":pick(["snelheid","afstand","duur"]);
    const snelheid = randInt(level===3?5:2, level===3?18:12)*10;
    const tijdUur = pick(level===3?[1,2,3,4,5,6]:[1,2,3,4]);
    const afstand = snelheid*tijdUur;
    let prompt, answer, unitLabel;
    if(type==="snelheid"){ prompt = `Een auto rijdt ${afstand} km in ${tijdUur} uur.\nWat is de gemiddelde snelheid? (in km/u)`; answer=snelheid; unitLabel="km/u"; }
    else if(type==="afstand"){ prompt = `Een auto rijdt met een snelheid van ${snelheid} km/u, gedurende ${tijdUur} uur.\nWelke afstand legt de auto af? (in km)`; answer=afstand; unitLabel="km"; }
    else { prompt = `Een auto rijdt ${afstand} km met een snelheid van ${snelheid} km/u.\nHoeveel uur duurt de rit?`; answer=tijdUur; unitLabel="uur"; }
    return { kind:"numeric", prompt, answerValue:answer, answerDisplay:`${answer} ${unitLabel}`, formatHint:"Typ alleen het getal.", placeholder:"antwoord" };
  },
  romeins(level){
    const maxByLevel = {1:40, 2:399, 3:3999};
    const num = randInt(1, maxByLevel[level]);
    const direction = pick(["naarRomeins","naarArabisch"]);
    if(direction==="naarRomeins"){
      return { kind:"text", prompt:`Schrijf dit getal in Romeinse cijfers:\n${num}`, answerText:toRoman(num), answerDisplay:toRoman(num), formatHint:"Gebruik hoofdletters: I, V, X, L, C, D, M.", placeholder:"bv. XIV" };
    }
    const roman = toRoman(num);
    return { kind:"numeric", prompt:`Welk getal is dit in Romeinse cijfers?\n${roman}`, answerValue:num, answerDisplay:String(num), formatHint:"Typ het getal in gewone cijfers.", placeholder:"antwoord" };
  },
  grafieken(level){
    const nCat = level===1?3:level===2?4:5;
    const maxVal = level===1?15:level===2?30:50;
    function genData(labels){
      let data, tries=0;
      do{ const chosen=shuffle(labels).slice(0,nCat); data=chosen.map(l=>({label:l, value:randInt(2,maxVal)})); tries++; }
      while(new Set(data.map(d=>d.value)).size !== data.length && tries<15);
      return data;
    }
    const formats = [
      { kind:"tabel", titel:"Aantal boeken gelezen deze maand", unit:"boeken", labels:["Anne","Bram","Cas","Dana","Emma","Finn"] },
      { kind:"tabel", titel:"Aantal doelpunten dit seizoen", unit:"doelpunten", labels:["Sanne","Milan","Yara","Noah","Fenna","Tijn"] },
      { kind:"staaf", titel:"Aantal verkochte ijsjes per dag", unit:"ijsjes", labels:["ma","di","wo","do","vr","za"] },
      { kind:"staaf", titel:"Aantal regenachtige uren per dag", unit:"uur", labels:["ma","di","wo","do","vr","za"] },
    ];
    const fmt = pick(formats);
    const data = genData(fmt.labels);
    const maxScale = Math.max(...data.map(d=>d.value)) * 1.15;
    let extraHtml;
    if(fmt.kind==="tabel"){
      extraHtml = `<div class="mono" style="font-weight:700; font-size:14px; margin-bottom:6px;">${esc(fmt.titel)}</div>
        <table class="data-table"><thead><tr><th>Naam</th><th>${esc(fmt.unit)}</th></tr></thead>
        <tbody>${data.map(d=>`<tr><td>${esc(d.label)}</td><td>${d.value}</td></tr>`).join("")}</tbody></table>`;
    } else {
      extraHtml = `<div class="mono" style="font-weight:700; font-size:14px; margin-bottom:2px;">${esc(fmt.titel)}</div>
        <div class="bar-chart">${data.map(d=>`
          <div class="bar-col"><div class="bar-val">${d.value}</div>
          <div class="bar-rect" style="height:${Math.round((d.value/maxScale)*120)}px;"></div>
          <div class="bar-label">${esc(d.label)}</div></div>`).join("")}</div>`;
    }
    const qTypes = level===1 ? ["lookup"] : level===2 ? ["lookup","sum","diff"] : ["lookup","sum","diff","max","min"];
    const qType = pick(qTypes);
    let prompt, res;
    if(qType==="lookup"){ const d=pick(data); prompt=`Kijk naar de gegevens hierboven.\nHoeveel ${fmt.unit} horen bij "${d.label}"?`; res={kind:"numeric", answerValue:d.value, answerDisplay:String(d.value)}; }
    else if(qType==="sum"){ const [d1,d2]=shuffle(data).slice(0,2); prompt=`Kijk naar de gegevens hierboven.\nHoeveel ${fmt.unit} horen bij "${d1.label}" en "${d2.label}" samen?`; res={kind:"numeric", answerValue:d1.value+d2.value, answerDisplay:String(d1.value+d2.value)}; }
    else if(qType==="diff"){ const [d1,d2]=shuffle(data).slice(0,2); prompt=`Kijk naar de gegevens hierboven.\nWat is het verschil tussen "${d1.label}" en "${d2.label}"?`; res={kind:"numeric", answerValue:Math.abs(d1.value-d2.value), answerDisplay:String(Math.abs(d1.value-d2.value))}; }
    else if(qType==="max"){ const w=data.reduce((a,b)=>a.value>b.value?a:b); prompt=`Kijk naar de gegevens hierboven.\nBij welke categorie hoort het hoogste aantal ${fmt.unit}?`; res={kind:"choice", options:shuffle(data.map(d=>d.label)), correctOption:w.label, answerDisplay:w.label}; }
    else { const l=data.reduce((a,b)=>a.value<b.value?a:b); prompt=`Kijk naar de gegevens hierboven.\nBij welke categorie hoort het laagste aantal ${fmt.unit}?`; res={kind:"choice", options:shuffle(data.map(d=>d.label)), correctOption:l.label, answerDisplay:l.label}; }
    return { ...res, prompt, extraHtml, formatHint: res.kind==="choice" ? "Kies het juiste antwoord." : "Typ alleen het getal.", placeholder:"antwoord" };
  }
};

function generateQuestion(subject, topicId, level, grade){
  const topics = topicsFor(subject, grade);

let fbApp=null, db=null, firebaseReady=false;
const _memoryFallback = {};
const safeLS = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return _memoryFallback[k]||null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){ _memoryFallback[k]=v; } }
};
function loadFirebaseConfig(){ try{ const raw=safeLS.get("firebaseConfigV1"); return raw?JSON.parse(raw):null; }catch(e){ return null; } }
function saveFirebaseConfig(cfg){ safeLS.set("firebaseConfigV1", JSON.stringify(cfg)); }
function parseConfigText(text){
  try{ const fn = new Function("return (" + text + ")"); const obj = fn(); if(obj && obj.apiKey && obj.projectId) return obj; }catch(e){}
  return null;
}
async function initFirebase(cfg){ fbApp = initializeApp(cfg); db = getFirestore(fbApp); firebaseReady = true; }

function queueJob(job){ const q=JSON.parse(safeLS.get("pendingWrites")||"[]"); q.push(job); safeLS.set("pendingWrites", JSON.stringify(q)); }
async function flushQueue(){
  if(!firebaseReady) return;
  let q; try{ q=JSON.parse(safeLS.get("pendingWrites")||"[]"); }catch(e){ q=[]; }
  if(!q.length) return;
  const remaining = [];
  for(const job of q){
    try{
      if(job.type==="answer") await remoteRecordAnswer(job.data);
      else if(job.type==="session") await remoteFinishSession(job.data);
    }catch(e){ remaining.push(job); }
  }
  safeLS.set("pendingWrites", JSON.stringify(remaining));
}

async function fsEnsureStatsDoc(profileId){
  const ref = doc(db,"stats",profileId);
  const snap = await getDoc(ref);
  if(!snap.exists()) await setDoc(ref, { topics:{}, sessions:[], streak:{current:0,best:0,lastDate:null}, stars:0, badges:[] });
  return ref;
}
async function remoteRecordAnswer(data){
  await addDoc(collection(db,"answers"), data);
  const ref = doc(db,"stats",data.profileId);
  await updateDoc(ref, {
    [`topics.${data.subject}:${data.topicId}.correct`]: increment(data.correct?1:0),
    [`topics.${data.subject}:${data.topicId}.total`]: increment(1),
  });
}
async function recordAnswer(profileId, subject, topicId, prompt, answerDisplay, userAnswer, correct, level){
  const data = { profileId, subject, topicId, prompt, answerDisplay, userAnswer:String(userAnswer==null?"":userAnswer), correct, level, date:new Date().toISOString() };
  try{ await fsEnsureStatsDoc(profileId); await remoteRecordAnswer(data); }
  catch(e){ queueJob({type:"answer", data}); }
}
async function remoteFinishSession(data){
  const { profileId, subject, topicId, score, total, levelMode, timedMode } = data;
  const ref = doc(db,"stats",profileId);
  const snap = await getDoc(ref);
  const cur = snap.exists() ? snap.data() : { topics:{}, sessions:[], streak:{current:0,best:0,lastDate:null}, stars:0, badges:[] };
  const today = todayStr();
  let streak = cur.streak || {current:0,best:0,lastDate:null};
  if(streak.lastDate !== today){
    const yesterday = new Date(Date.now()-86400000).toISOString().slice(0,10);
    streak.current = (streak.lastDate === yesterday) ? (streak.current+1) : 1;
    streak.best = Math.max(streak.best||0, streak.current);
    streak.lastDate = today;
  }
  const pct = Math.round((score/total)*100);
  const starsEarned = score*10 + (score===total?50:0);
  const newStars = (cur.stars||0) + starsEarned;
  const totalCorrectAllTime = Object.values(cur.topics||{}).reduce((a,t)=>a+(t.correct||0),0);
  const metrics = { sessionsCount:(cur.sessions?cur.sessions.length:0)+1, sessionPct:pct, currentStreak:streak.current, totalCorrectAllTime };
  const existingBadges = new Set(cur.badges||[]);
  const newlyEarned = [];
  BADGES.forEach(b=>{ if(!existingBadges.has(b.id) && b.check(metrics)){ existingBadges.add(b.id); newlyEarned.push(b); } });
  const sessionEntry = { date:new Date().toISOString(), subject, topicId, score, total, levelMode, timedMode };
  await setDoc(ref, { sessions:[...(cur.sessions||[]).slice(-59), sessionEntry], streak, stars:newStars, badges:Array.from(existingBadges) }, {merge:true});
  return { newlyEarned, starsEarned, streak, totalStars:newStars };
}
async function finishSession(profileId, subject, topicId, score, total, levelMode, timedMode){
  const data = { profileId, subject, topicId, score, total, levelMode, timedMode };
  try{ return await remoteFinishSession(data); }
  catch(e){ queueJob({type:"session", data}); return null; }
}
async function loadProfileStats(profileId){
  try{ const snap = await getDoc(doc(db,"stats",profileId)); return snap.exists() ? snap.data() : { topics:{}, sessions:[], streak:{current:0,best:0,lastDate:null}, stars:0, badges:[] }; }
  catch(e){ return null; }
}
async function loadAnswersForProfile(profileId){
  try{
    const q = query(collection(db,"answers"), where("profileId","==",profileId), limit(500));
    const snap = await getDocs(q);
    const out = []; snap.forEach(d=>out.push(d.data()));
    out.sort((a,b)=> b.date.localeCompare(a.date));
    return out;
  }catch(e){ return []; }
}
async function loadProfilesConfig(){
  try{ const snap = await getDoc(doc(db,"config","profiles")); return snap.exists() ? snap.data() : null; }
  catch(e){ return null; }
}

};

function clearTimer(){ if(state.timerId){ clearInterval(state.timerId); state.timerId=null; } }
function showToast(msg){ state.toast = msg; render(); setTimeout(()=>{ state.toast=null; const t=document.getElementById("toastEl"); if(t) t.remove(); }, 3200); }

/* ---------- Sessieflow (kind) ---------- */
function startSession(){
  clearTimer();
  const maxLvl = maxLevelForGrade(state.grade);
  const initLevel = state.levelMode==="auto" ? Math.min(2,maxLvl) : Math.min(parseInt(state.levelMode,10), maxLvl);
  state.level = initLevel;
  state.consecWrong=0; state.consecCorrect=0; state.levelMsg="";
  state.qCount=0; state.history=[]; state.streak=0; state.bestStreak=0; state.sessionReward=null;
  state.screen="practice";
  nextQuestion();
}
function nextQuestion(){
  clearTimer();
  state.currentQ = generateQuestion(state.subject, state.topicId, state.level, state.grade);
  state.submitted=false; state.correctFlag=false; state.chosenOption=null; state.timeLeft=TIME_PER_Q;
  render();
  if(state.timedMode){
    state.timerId = setInterval(()=>{
      state.timeLeft--;
      const el=document.getElementById("timerVal");
      if(el){ el.textContent=state.timeLeft+"s"; el.className="timer"+(state.timeLeft<=8?" low":""); }
      if(state.timeLeft<=0){ clearTimer(); handleAnswer(null, true); }
    }, 1000);
  }
}
function evaluateAnswer(q, userInput, chosenOption, timedOut){
  if(timedOut) return false;
  if(q.kind==="numeric") return checkNumeric(userInput, q.answerValue);
  if(q.kind==="text") return checkText(userInput, q.answerText);
  if(q.kind==="choice") return chosenOption===q.correctOption;
  return false;
}
async function handleAnswer(userInput, timedOut){
  if(state.submitted) return;
  clearTimer();
  const q = state.currentQ;
  const chosen = q.kind==="choice" ? userInput : null;
  const ok = evaluateAnswer(q, userInput, chosen, timedOut);
  state.submitted=true; state.correctFlag=ok; state.chosenOption=chosen; state.qCount++;
  state.history.push({ prompt:q.prompt, answerDisplay:q.answerDisplay, correct:ok, level:state.level, timedOut:!!timedOut, topicId:q.topicId });

  if(ok){ state.streak++; state.bestStreak=Math.max(state.bestStreak, state.streak); state.consecCorrect++; state.consecWrong=0; }
  else { state.streak=0; state.consecWrong++; state.consecCorrect=0; }

  state.levelMsg="";
  const maxLvl = maxLevelForGrade(state.grade);
  if(state.levelMode==="auto"){
    if(state.consecWrong>=2 && state.level>1){ state.level--; state.consecWrong=0; state.levelMsg="Niveau aangepast: iets makkelijker 👍"; }
    else if(state.consecCorrect>=3 && state.level<maxLvl){ state.level++; state.consecCorrect=0; state.levelMsg="Niveau aangepast: iets moeilijker 💪"; }
  }
  render();
  const userAnswerStr = q.kind==="choice" ? chosen : userInput;
  recordAnswer(state.profileId, state.subject, q.topicId, q.prompt, q.answerDisplay, timedOut?"(geen antwoord — tijd op)":userAnswerStr, ok, state.level);
}
async function goNext(){
  if(state.qCount>=TOTAL_Q){
    clearTimer();
    const score = state.history.filter(h=>h.correct).length;
    state.screen="result"; render();
    const reward = await finishSession(state.profileId, state.subject, state.topicId, score, TOTAL_Q, state.levelMode, state.timedMode);
    if(reward){
      state.sessionReward = reward;
      if(state.myStats){ state.myStats.stars = reward.totalStars; state.myStats.streak = reward.streak; if(reward.newlyEarned.length) state.myStats.badges=[...(state.myStats.badges||[]), ...reward.newlyEarned.map(b=>b.id)]; }
      render();
      if(reward.newlyEarned.length) showToast(`🎉 Nieuwe badge: ${reward.newlyEarned.map(b=>b.icon+" "+b.label).join(", ")}`);
    }
    return;
  }
  nextQuestion();
}

      <div style="font-size:38px;">🏆</div>
      <div style="font-family:'Baloo 2',sans-serif; font-weight:800; font-size:25px;">${score} van de ${TOTAL_Q} goed</div>
      <p class="muted" style="font-size:14px; margin-top:6px;">${msg} Langste reeks: ${state.bestStreak} 🔥</p>
      <p class="muted" style="font-size:12.5px; margin-top:4px;">${lvlMsg}</p>
      ${r ? `<div class="star-strip" style="justify-content:center; margin-top:16px;">
        <span class="stat-chip">⭐ +${r.starsEarned} sterren (totaal ${r.totalStars})</span>
        <span class="stat-chip">🔥 ${r.streak.current} dagen op rij</span>
      </div>` : `<p class="muted" style="font-size:12px; margin-top:10px;">Sterren worden zo bijgewerkt…</p>`}
      <div class="row gap10" style="justify-content:center; margin-top:20px;">
        <button class="btn" data-action="restart">🔁 Nog een rondje</button>
        <button class="btn secondary" data-action="back-settings">Ander onderwerp</button>
      </div>
    </div>
    <div style="font-size:13px; font-weight:800; color:var(--ink-soft); margin-bottom:8px; text-transform:uppercase; letter-spacing:.5px;">Overzicht</div>
    ${state.history.map(h=>`
      <div class="result-row" style="border-color:${h.correct?'var(--green)':'var(--red)'};">
        <span>${h.correct ? "✅" : "❌"}</span>
        <div class="mono" style="font-size:13px; font-weight:700; white-space:pre-line; flex:1;">${esc(h.prompt)}</div>
        <div style="font-size:13px; font-weight:800;">${esc(h.answerDisplay)}</div>
      </div>
    `).join("")}
  `;
}

function renderBadgesScreen(){
  const earned = new Set((state.myStats?.badges)||[]);
  return `
    ${renderHeader(true,true)}
    <div class="card">
      <h2 style="font-size:20px; margin-bottom:14px;">Mijn badges</h2>
      <div style="display:flex; flex-wrap:wrap;">
        ${BADGES.map(b=>`
          <div class="badge-chip ${earned.has(b.id)?'':'locked'}" title="${esc(b.desc)}">
            <div class="ic">${b.icon}</div>
            <div class="lb">${esc(b.label)}</div>
          </div>`).join("")}
      </div>
      <p class="muted" style="font-size:12.5px; margin-top:16px;">Beweeg of tik op een badge voor uitleg. Verdien sterren door vragen goed te beantwoorden en badges door goed te scoren en regelmatig te oefenen!</p>
    </div>
  `;
}

/* ---------- Ouder omgeving ---------- */
function progressColor(pct){ if(pct<60) return "var(--red)"; if(pct<80) return "var(--amber)"; return "var(--green)"; }
function progressFlag(pct){ if(pct<60) return `<span class="flag low">extra aandacht</span>`; if(pct<80) return `<span class="flag mid">oefenen</span>`; return `<span class="flag high">sterk</span>`; }

function renderOuder(){
  const cfg = state.profilesConfig || {};
  const child = state.ouderChild;
  const childCfg = cfg[child] || {naam:child, grade:8};
  if(state.ouderLoading){
    return `${renderHeader(false,true)}
      <div class="seg-group" style="margin-bottom:18px;">
        <button class="seg ${child==='adam'?'active':''}" data-action="ouder-child" data-value="adam">👦 ${esc(cfg.adam?.naam||"Adam")}</button>
        <button class="seg ${child==='leena'?'active':''}" data-action="ouder-child" data-value="leena">👧 ${esc(cfg.leena?.naam||"Leena")}</button>
      </div>
      <div class="loading">Voortgang laden…</div>`;
  }
  const stats = state.ouderStats || {topics:{}, sessions:[], streak:{current:0,best:0}, stars:0, badges:[]};
  const subjects = [ {id:"reken", label:"Rekenen", topics:topicsFor("reken", childCfg.grade||8)}, {id:"taal", label:"Taal & Spelling", topics:topicsFor("taal", childCfg.grade||8)} ];
  let totalCorrect=0, totalAll=0;
  Object.values(stats.topics).forEach(t=>{ totalCorrect+=t.correct; totalAll+=t.total; });
  const overallPct = totalAll ? Math.round((totalCorrect/totalAll)*100) : null;
  const earnedBadges = new Set(stats.badges||[]);

  const subjectBlocks = subjects.map(s=>{
    const rows = s.topics.map(t=>{
      const key=`${s.id}:${t.id}`; const d=stats.topics[key];
      const total=d?d.total:0, correct=d?d.correct:0, pct= total?Math.round((correct/total)*100):null;
      return {...t, total, correct, pct, key};
    }).sort((a,b)=>{ if(a.total===0&&b.total===0) return 0; if(a.total===0) return 1; if(b.total===0) return -1; return a.pct-b.pct; });
    return `<div style="margin-bottom:26px;">
      <h3 style="font-size:17px; margin-bottom:12px;">${esc(s.label)}</h3>
      ${rows.map(r=>`
        <div class="progress-row" style="cursor:${r.total?'pointer':'default'};" ${r.total?`data-action="drill" data-value="${r.key}"`:""}>
          <div class="row between" style="margin-bottom:4px; font-size:13.5px; font-weight:700;">
            <span>${r.icon} ${esc(r.label)} ${r.total ? progressFlag(r.pct) : `<span class="flag mid">nog niet geoefend</span>`}</span>
            <span class="muted">${r.total ? `${r.correct}/${r.total} goed (${r.pct}%) ${'›'}` : "—"}</span>
          </div>
          <div class="progress-bar-bg"><div class="progress-bar-fill" style="width:${r.total?r.pct:0}%; background:${r.total?progressColor(r.pct):'transparent'};"></div></div>
        </div>`).join("")}
    </div>`;
  }).join("");

  const sessionRows = (stats.sessions||[]).slice().reverse().slice(0,15).map(sess=>{
    const dt = new Date(sess.date);
    const dateStr = dt.toLocaleDateString("nl-NL",{day:"2-digit",month:"2-digit"})+" "+dt.toLocaleTimeString("nl-NL",{hour:"2-digit",minute:"2-digit"});
    const meta = topicMeta(sess.subject, sess.topicId);
    const subjLabel = sess.subject==="reken" ? "Rekenen" : "Taal";
    return `<div class="sess-row"><span class="muted mono" style="min-width:88px;">${dateStr}</span><span style="flex:1;">${subjLabel} — ${esc(meta.label)}${sess.timedMode?" ⏱️":""}</span><span style="font-weight:800;">${sess.score}/${sess.total}</span></div>`;
  }).join("");

  return `
    ${renderHeader(false,true)}
    <div class="seg-group" style="margin-bottom:18px;">
      <button class="seg ${child==='adam'?'active':''}" data-action="ouder-child" data-value="adam">👦 ${esc(cfg.adam?.naam||"Adam")}</button>
      <button class="seg ${child==='leena'?'active':''}" data-action="ouder-child" data-value="leena">👧 ${esc(cfg.leena?.naam||"Leena")}</button>
    </div>
    <div class="star-strip">
      <span class="stat-chip">⭐ ${stats.stars||0} sterren</span>
      <span class="stat-chip">🔥 ${stats.streak?.current||0} dagen op rij (langste: ${stats.streak?.best||0})</span>
      <span class="stat-chip">🏅 ${earnedBadges.size}/${BADGES.length} badges</span>
    </div>
    <div class="card" style="margin-bottom:22px;">
      <div class="badge" style="color:var(--ink-soft); margin-bottom:6px;">Ouder omgeving</div>
      <h2 style="font-size:22px; margin-bottom:4px;">Voortgang van ${esc(childCfg.naam||child)} (groep ${childCfg.grade||"—"})</h2>
      <p class="muted" style="font-size:13.5px; margin-top:6px;">
        ${totalAll ? `In totaal ${totalAll} vragen beantwoord, ${overallPct}% goed.` : "Nog niet geoefend."}
        Tik op een onderdeel voor de losse vragen. Rood (&lt;60%) betekent <span class="flag low" style="margin-left:0;">extra aandacht</span> nodig.
      </p>
    </div>
    ${subjectBlocks}
    <div style="font-size:13px; font-weight:800; color:var(--ink-soft); margin:22px 0 8px; text-transform:uppercase; letter-spacing:.5px;">Laatste oefenrondes</div>
    ${sessionRows || `<p class="muted" style="font-size:13px;">Nog geen rondes voltooid.</p>`}
    <div class="row gap10" style="margin-top:26px; justify-content:center;">
      <button class="btn secondary" data-action="refresh-ouder" style="font-size:12.5px; padding:9px 16px;">🔄 Ververs</button>
      <button class="btn secondary" data-action="reset-stats" style="font-size:12.5px; padding:9px 16px;">Wis voortgang van ${esc(childCfg.naam||child)}</button>
      <button class="btn secondary" data-action="edit-wizard" style="font-size:12.5px; padding:9px 16px;">⚙️ Profielen bewerken</button>
    </div>
  `;
}

function renderDrill(){
  const cfg = state.profilesConfig || {};
  const child = state.ouderChild;
  const childCfg = cfg[child] || {naam:child};
  const [subj, topicId] = (state.drillTopicKey||"").split(":");
  const meta = topicMeta(subj, topicId);
  const rows = state.drillData.filter(a=>a.subject===subj && a.topicId===topicId).slice(0,60);
  return `
    ${renderHeader(false,true)}
    <div class="row between" style="margin-bottom:14px;">
      <button class="btn secondary" data-action="back-ouder">← Terug naar overzicht</button>
    </div>
    <div class="card" style="margin-bottom:18px;">
      <div class="badge" style="color:${meta.color};">${meta.icon} ${esc(meta.label)}</div>
      <h2 style="font-size:20px; margin-top:4px;">Losse vragen van ${esc(childCfg.naam||child)}</h2>
      <p class="muted" style="font-size:13px; margin-top:4px;">Meest recente ${rows.length} vragen voor dit onderdeel.</p>
    </div>
    ${rows.length ? rows.map(a=>{
      const dt = new Date(a.date);
      const dateStr = dt.toLocaleDateString("nl-NL",{day:"2-digit",month:"2-digit"})+" "+dt.toLocaleTimeString("nl-NL",{hour:"2-digit",minute:"2-digit"});
      return `<div class="result-row" style="border-color:${a.correct?'var(--green)':'var(--red)'}; align-items:flex-start;">
        <span>${a.correct?"✅":"❌"}</span>
        <div style="flex:1;">
          <div class="muted mono" style="font-size:11px; margin-bottom:3px;">${dateStr}</div>
          <div class="mono" style="font-size:13px; font-weight:700; white-space:pre-line;">${esc(a.prompt)}</div>
          <div style="font-size:12.5px; margin-top:4px;">
            Antwoord van ${esc(childCfg.naam||child)}: <b>${esc(a.userAnswer||"—")}</b>
            ${!a.correct ? ` &nbsp;•&nbsp; Juist: <b>${esc(a.answerDisplay)}</b>` : ""}
          </div>
        </div>
      </div>`;
    }).join("") : `<p class="muted">Nog geen vragen beantwoord voor dit onderdeel.</p>`}
  `;
}

/* =========================================================
   EVENT HANDLING
========================================================= */
function attachHandlers(){
  document.querySelectorAll("[data-action]").forEach(el=> el.addEventListener("click", onAction));
  const input = document.getElementById("answerInput");
  if(input){ input.focus(); input.addEventListener("keydown", (e)=>{ if(e.key==="Enter") handleAnswer(input.value, false); }); }
}

async function onAction(e){
  const action = e.currentTarget.dataset.action;
  const value = e.currentTarget.dataset.value;

  if(action==="connect-firebase"){
    const text = document.getElementById("cfgInput").value;
    const cfg = parseConfigText(text);
    if(!cfg){ state.configError="Kon de configuratie niet lezen. Controleer of je het hele object hebt geplakt."; state.configText=text; render(); return; }
    try{
      await initFirebase(cfg);
      const profConf = await loadProfilesConfig();
      saveFirebaseConfig(cfg);
      state.configError=""; state.profilesConfig=profConf;
      state.screen = profConf ? "profile-picker" : "wizard";
      if(!profConf) state.wizardDraft = { adam:{naam:"Adam",grade:8,pin:"1111"}, leena:{naam:"Leena",grade:5,pin:"2222"}, ouder:{pin:"0000"} };
      flushQueue();
    }catch(err){ state.configError="Verbinden lukte niet. Controleer de gegevens en of Firestore is aangemaakt."; state.configText=text; }
    render(); return;
  }
  if(action==="pick-profile"){ state.pendingProfile=value; state.pinInput=""; state.pinError=""; state.screen="pin-entry"; render(); return; }
  if(action==="pin-back-to-picker"){ state.screen="profile-picker"; render(); return; }
  if(action==="pin-clear"){ state.pinInput=""; state.pinError=""; render(); return; }
  if(action==="pin-digit"){
    if(state.pinInput.length>=4) return;
    state.pinInput += value; render();
    if(state.pinInput.length===4){
      const cfg = state.profilesConfig||{};
      const expected = state.pendingProfile==="ouder" ? cfg.ouder?.pin : cfg[state.pendingProfile]?.pin;
      if(state.pinInput===expected){
        if(state.pendingProfile==="ouder"){
          state.profileId="ouder"; state.profileName="Ouder"; state.grade=null;
          state.ouderChild="adam"; state.ouderLoading=true; state.screen="ouder"; render();
          state.ouderStats = await loadProfileStats("adam"); state.ouderLoading=false; render();
        } else {
          const pc = cfg[state.pendingProfile];
          state.profileId = state.pendingProfile; state.profileName = pc.naam; state.grade = pc.grade;
          state.subject="reken"; state.topicId=null; state.levelMode="auto"; state.timedMode=false;
          state.myStats = await loadProfileStats(state.profileId);
          state.screen="settings"; render();
        }
        flushQueue();
      } else {
        setTimeout(()=>{ state.pinInput=""; state.pinError="Onjuiste pincode, probeer opnieuw."; render(); }, 350);
      }
    }
    return;
  }
  if(action==="edit-wizard"){
    const cfg = state.profilesConfig || { adam:{naam:"Adam",grade:8,pin:"1111"}, leena:{naam:"Leena",grade:5,pin:"2222"}, ouder:{pin:"0000"} };
    state.wizardDraft = JSON.parse(JSON.stringify(cfg));
    state.screen="wizard"; render(); return;
  }
  if(action==="back-picker"){ state.screen="profile-picker"; render(); return; }
  if(action==="save-wizard"){
    const draft = {
      adam:{ naam:document.getElementById("w-adam-naam").value.trim()||"Adam", grade:parseInt(document.getElementById("w-adam-grade").value,10), pin:document.getElementById("w-adam-pin").value.trim()||"1111" },
      leena:{ naam:document.getElementById("w-leena-naam").value.trim()||"Leena", grade:parseInt(document.getElementById("w-leena-grade").value,10), pin:document.getElementById("w-leena-pin").value.trim()||"2222" },
      ouder:{ pin:document.getElementById("w-ouder-pin").value.trim()||"0000" }
    };
    await saveProfilesConfig(draft);
    state.profilesConfig = draft; state.screen="profile-picker"; render(); return;
  }
  if(action==="logout"){ clearTimer(); state.profileId=null; state.profileName=null; state.grade=null; state.myStats=null; state.screen="profile-picker"; render(); return; }
  if(action==="show-badges"){ state.screen="badges"; render(); return; }
  if(action==="subject"){ state.subject=value; state.topicId=null; render(); return; }
  if(action==="topic"){ state.topicId=value; render(); return; }
  if(action==="level"){ state.levelMode=value; render(); return; }
  if(action==="timed"){ state.timedMode = value==="1"; render(); return; }
  if(action==="start"){ if(state.topicId) startSession(); return; }
  if(action==="back-settings"){ clearTimer(); state.screen="settings"; render(); return; }
  if(action==="submit"){ const input=document.getElementById("answerInput"); handleAnswer(input?input.value:"", false); return; }
  if(action==="choose"){ handleAnswer(value, false); return; }
  if(action==="next"){ goNext(); return; }
  if(action==="restart"){ startSession(); return; }

  if(action==="ouder-child"){
    state.ouderChild = value; state.ouderLoading=true; state.screen="ouder"; render();
    state.ouderStats = await loadProfileStats(value); state.ouderLoading=false; render(); return;
  }
  if(action==="refresh-ouder"){
    state.ouderLoading=true; render();
    state.ouderStats = await loadProfileStats(state.ouderChild); state.ouderLoading=false; render(); return;
  }
  if(action==="reset-stats"){
    const cfg = state.profilesConfig||{}; const naam = cfg[state.ouderChild]?.naam || state.ouderChild;
    if(window.confirm(`Weet je zeker dat je alle voortgang van ${naam} wilt wissen? Dit kan niet ongedaan worden gemaakt.`)){
      await resetProfileStats(state.ouderChild);
      state.ouderStats = await loadProfileStats(state.ouderChild); render();
    }
    return;
  }
  if(action==="drill"){
    state.drillTopicKey = value; state.screen="drill"; render();
    state.drillData = await loadAnswersForProfile(state.ouderChild); render(); return;
  }
  if(action==="back-ouder"){ state.screen="ouder"; render(); return; }
}

/* =========================================================
   OPSTARTEN
========================================================= */
(async function init(){
  const cfg = loadFirebaseConfig();
  if(!cfg){ state.screen="firebase-setup"; render(); return; }
  try{
    await initFirebase(cfg);
    const profConf = await loadProfilesConfig();
    state.profilesConfig = profConf;
    if(!profConf){
      state.wizardDraft = { adam:{naam:"Adam",grade:8,pin:"1111"}, leena:{naam:"Leena",grade:5,pin:"2222"}, ouder:{pin:"0000"} };
      state.screen="wizard";
    } else {
      state.screen="profile-picker";
    }
    flushQueue();
  }catch(e){
    state.screen="firebase-setup"; state.configError="Automatisch verbinden lukte niet. Controleer je configuratie."; state.configText = JSON.stringify(cfg, null, 2);
  }
  render();
})();
</script>
